<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rules engine: Ethan Redwood</title>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#edf1ec;--sf:#fff;--ink:#1c2a24;--mut:#5b6b63;--ac:#2d6a55;--on:#fff;--ac2:#8b4a7a;--ln:#cfd8d2;--bad:#a3362d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#131a17;--sf:#1b2420;--ink:#e3ebe5;--mut:#93a39a;--ac:#74c7a6;--on:#10201a;--ac2:#d79bc8;--ln:#2d3a34;--bad:#ef8b80;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#131a17;--sf:#1b2420;--ink:#e3ebe5;--mut:#93a39a;--ac:#74c7a6;--on:#10201a;--ac2:#d79bc8;--ln:#2d3a34;--bad:#ef8b80;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Atkinson Hyperlegible",system-ui,sans-serif;padding:20px 16px 48px}
main{max-width:1080px;margin:0 auto}
h1{font-size:2rem;margin:0;line-height:1.1}
h2{font-size:1.1rem;margin:0 0 10px}
.sub{color:var(--mut);margin:4px 0 20px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
@media (max-width:800px){.grid{grid-template-columns:1fr}}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:8px;padding:16px;margin-bottom:16px;min-width:0}
.stats{display:flex;flex-wrap:wrap;gap:6px 18px;margin-bottom:10px;font-weight:700}
.sheet div{padding:1px 0}
.sheet .h{color:var(--mut);margin-top:10px;font-weight:700}
.sheet .p{color:var(--ac2)}
label{display:block}
select,textarea,button,input[type=number]{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--ln);border-radius:6px;padding:6px 8px}
select{width:100%;margin:2px 0 10px}
.row{display:flex;flex-wrap:wrap;gap:4px 16px;margin-bottom:10px}
.row label{display:flex;gap:6px;align-items:center}
button{cursor:pointer}
button.go{background:var(--ac);color:var(--on);border-color:var(--ac);font-weight:700;padding:10px 18px;font-size:1.05rem}
:focus-visible{outline:3px solid var(--ac2);outline-offset:2px}
.break{display:flex;justify-content:space-between;gap:12px;font-size:.95rem}
.break b{white-space:nowrap}
.total{border-top:1px solid var(--ln);margin-top:6px;padding-top:6px;font-weight:700}
.big{font-size:3.4rem;font-weight:700;line-height:1;color:var(--ac);margin:12px 0 2px}
.mut{color:var(--mut)}
.proc{color:var(--ac2);font-weight:700}
.src h3{font-size:.95rem;color:var(--mut);margin:12px 0 4px}
.src label{display:flex;gap:8px;align-items:flex-start;padding:2px 0}
textarea{width:100%;min-height:260px;font:13px/1.4 ui-monospace,monospace}
.err{color:var(--bad);margin:6px 0}
</style></head><body><main>
<label style="max-width:260px"><span class="mut">Character</span><select id="cs"></select></label>
<h1 id="nm"></h1><p class="sub" id="sb"></p>
<div class="grid">
<div>
 <section class="card"><h2>Short sheet</h2><div class="stats" id="st"></div><div class="sheet" id="sh"></div></section>
 <section class="card src"><h2>Traits and gear</h2><p class="mut" style="margin:0 0 4px">Untick anything that is not active. The sheet and rolls update at once.</p><div id="sr"></div></section>
</div>
<div>
 <section class="card"><h2>Roll an action</h2>
  <label>School<select id="sc"></select></label>
  <label>Action type<select id="ty"></select></label>
  <div class="row" id="md"></div>
  <label>Enemy proficiency in this school (for crits) <input type="number" id="en" value="0" style="width:5em"></label>
  <div class="card" style="background:var(--bg);margin-bottom:12px"><div id="pv"></div></div>
  <div id="pc"></div>
  <button class="go" id="go">Roll d100</button>
  <div id="rs" aria-live="polite"></div>
 </section>
 <details class="card"><summary>Character data (JSON)</summary>
  <p class="mut">This is the whole character. Edit it, then apply.</p>
  <textarea id="js" spellcheck="false"></textarea>
  <div class="err" id="er"></div><button id="ap">Apply changes</button>
 </details>
</div></div>
</main>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const G={physical:["piercing","slashing","bludgeoning","ranged","voice","poison","disease","acid","tech"],elemental:["air","water","fire","earth","spirit","decay"],cosmic:["arcane","fel","light","shadow","nature","death","psychic"],armor:["cloth","leather","mail","plate"]};
const P={};for(const g in G)G[g].forEach(s=>P[s]=g);
const N={air:"air/lightning",water:"water/ice",arcane:"arcane/order",fel:"fel/chaos",light:"light/holy",nature:"nature/life",shadow:"shadow/void",dot:"DoT",hot:"HoT",nonmagical:"non-magical",dotdef:"DoT defense",controldef:"control defense",debuffdef:"debuff defense",sizedef:"size defense",mana:"mana recovery",summon:"summoning",aoo:"attack of opportunity",hoo:"heal of opportunity",tank:"tanking",ownattack:"own attack"};
const T={Actions:[["attack","Attack"],["dot","DoT"],["healing","Healing"],["hot","HoT"],["mana","Mana recovery"],["control","Control"],["displace","Displace"],["buff","Buff"],["debuff","Debuff"],["summon","Summoning"],["inspire","Inspire"],["reflect","Reflect"],["conjure","Conjuration"],["mend","Mending"],["recharge","Recharge"],["copy","Copy knowledge"],["size","Enlarge/Reduce"],["stealth","Stealth"]],Defensive:[["defense","Defense"],["dotdef","DoT defense"],["controldef","Control defense"],["debuffdef","Debuff defense"],["hold","Hold"],["sizedef","Size defense"]],Reactions:[["aoo","Attack of opportunity","attack"],["hoo","Heal of opportunity","healing"],["interrupt","Interrupt"],["tank","Tank"],["aid","Aid"]]};
const TY=new Set();for(const g in T)T[g].forEach(([i,n,p])=>{TY.add(i);if(p)P[i]=p;N[i]=N[i]||n.toLowerCase()});
const MODS=[["minor","Minor effect"],["taunt","Taunt"],["flare","Flare"],["cleansing","Cleansing"],["weapon","Weapon attack"],["ownattack","Own attack"]];
const nm=t=>N[t]||t;
const anc=t=>{const s=[t];while(P[t]){t=P[t];s.push(t)}return s};
const rank=t=>TY.has(t)?2:["minor","cleansing","nonmagical","taunt","flare","weapon","ownattack"].includes(t)?0:1;
const label=w=>[...w].filter(t=>!(t==="control"&&(w.includes("taunt")||w.includes("flare")))).sort((a,b)=>rank(a)-rank(b)).map(nm).join(" ");
const sg=n=>(n>=0?"+":"\u2212")+Math.abs(n);

const ETHAN={name:"Ethan Redwood",sub:"Human/Worgen Druid/Keeper \u00b7 53/75 AP",
base:{health:7,armor:0,mana:8,speed:6,stamina:3},
profs:{leather:5,slashing:5,piercing:5,bludgeoning:5,nature:15,arcane:12,death:13,earth:2},
src:[
{n:"Everbloom Lore",k:"Traits",b:[[["healing"],10]]},
{n:"Drawing Water from a Rock",k:"Traits",b:[[["healing"],5]]},
{n:"Healing Training",k:"Traits",b:[[["healing"],5]]},
{n:"Nature's Cure",k:"Traits",b:[[["cleansing"],10]]},
{n:"Make Like a Tree",k:"Traits",b:[[["defense"],15]]},
{n:"Entangler",k:"Traits",b:[[["control"],10]]},
{n:"Root Training",k:"Traits",b:[[["control"],5]]},
{n:"Moonfire Training x2",k:"Traits",b:[[["dot"],15]]},
{n:"Klutz",k:"Traits",t:"Crit fail +1 dmg"},
{n:"Just a Country Doctor",k:"Traits",b:[[["attack","nonmagical"],-10]]},
{n:"Resilience",k:"Traits",b:[[["controldef"],10]]},
{n:"Inspiration Training",k:"Traits",b:[[["inspire"],10]]},
{n:"Warding",k:"Traits",s:{ward:1}},
{n:"Arcane Proficiency",k:"Proficiency and class",t:"3x per day, BA mana recovery"},
{n:"Nature Proficiency",k:"Proficiency and class",t:"\u22121 nature/life dmg"},
{n:"Natural Shapeshifter",k:"Proficiency and class",t:"Shapeshifting removes movement-impairing effects (druid)"},
{n:"Shapeshifting Boon",k:"Proficiency and class",t:"3x per day, buff related roll or attribute on bonus action shapeshift"},
{n:"Replenishment",k:"Proficiency and class",t:"Each turn an enemy is rooted, heal self for +1 HP (keeper)"},
{n:"Force of Nature",k:"Proficiency and class",t:"Summon a non-heroic treant that doesn't count against summon caps"},
{n:"Branch of G'Hanir",k:"Weapons",t:"Weapon: 3 nature dmg, 8 dur. \u00b7 6x per day, BA healing"},
{n:"Malchazeen",k:"Weapons",t:"Secondary: 2 piercing dmg, 10 dur. \u00b7 +1 dmg on critical strikes"},
{n:"Tome of Divine Right",k:"Weapons",t:"Secondary: 3 nature/life dmg, 8 dur.",s:{spirit:1},b:[[["healing"],5]]},
{n:"Hallowhide Jerkin",k:"Armor",s:{armor:4,health:1},b:[[["healing"],10]]},
{n:"Druidic Arcana",k:"Armor",s:{mana:1},b:[[["control"],5],[["dot"],5]]},
{n:"Padded Tsukumonuno Leggings",k:"Armor",s:{armor:2,mana:2}},
{n:"Sea Devil's Quick Step",k:"Armor",s:{armor:2,speed:1}},
{n:"Tome of Inspiring Nature",k:"Accessories",t:"3x per day, BA inspire",b:[[["inspire"],10]]},
{n:"Eye of Muuluxfu",k:"Accessories",b:[[["control","minor"],10]],p:[{w:["control"],d:3,on:3,t:"also apply disarm, tranquilize or silence"}]},
{n:"High Architect's Ring",k:"Accessories",s:{"spell penetration":1,avoidance:1}},

]};
const GALGAR={name:"Galgar Flamehair",sub:"Half-orc Blademaster \u00b7 54/82 AP",
base:{health:9,armor:0,rage:7,speed:6,stamina:3},
profs:{plate:7,slashing:13,piercing:5,bludgeoning:5,voice:5,fire:6,air:5,death:6,arcane:5},
src:[
{n:"Assault Training",k:"Traits",b:[[["attack"],15]]},
{n:"Sweeping Strikes",k:"Traits",t:"Odd-numbered attack roll, deal 1 dmg to another melee target"},
{n:"Power of Frustration",k:"Traits",t:"On 2 or more HP lost at once, or 3x1 HP lost in a row, +15 to melee attack"},
{n:"Clumsy",k:"Traits",t:"Offensive crit fail +1 dmg"},
{n:"Enrage",k:"Traits",t:"BA buff own attack"},
{n:"More Enraged x2",k:"Traits",b:[[["buff","ownattack"],10]]},
{n:"Execute",k:"Traits",t:"If attack leaves enemy at 1 HP, execute"},
{n:"Condemn",k:"Traits",t:"If enemy survives a powered attack, refund 1 rage"},
{n:"Resilience Training x2",k:"Traits",b:[[["controldef"],10]]},
{n:"Tanking Training x2",k:"Traits",b:[[["tank"],10]]},
{n:"Resistance",k:"Traits",p:[{w:["defense"],d:3,on:2,t:"on a failed roll, take 1 less damage"}]},
{n:"Titan's Grip",k:"Traits",t:"Can use one two-handed weapon without a BA or damage penalty"},
{n:"Yelling Louder",k:"Traits",t:"3x per day, BA taunt",b:[[["control","taunt"],15]]},
{n:"Resilience Training",k:"Traits",s:{"battlefield resilience":1}},
{n:"Mirror Image",k:"Traits",t:"ULT: summon a non-heroic air elemental mirror image for 3 rounds. It mirrors Galgar's actions, enemies are confused between them, +15 defense"},
{n:"Reflective",k:"Class",t:"Reflect always does full damage (class)"},
{n:"Ignore Pain",k:"Class",t:"Can tank multiple times (warrior)"},
{n:"Suppressing Fire",k:"Class",t:"BA suppress target, gaining additional AoO against it when it attacks (soldier)"},
{n:"Manifest Echo",k:"Class",t:"BA swap location with mirror image (echo knight)"},
{n:"Eviscerata",k:"Weapons",t:"Weapon: 5 slashing dmg, 8 dur. \u00b7 On attack, +1 dmg (Burning Blade)"},
{n:"Rwngal",k:"Weapons",t:"Secondary: 3 arcane dmg, 8 dur. \u00b7 1x per day, roll attack/heal resource on all enemies in 15ft"},
{n:"Lanao's Overconfidence",k:"Armor",s:{armor:5,expertise:2}},
{n:"Ancestral Vrykul Armor 2.0",k:"Armor",s:{armor:6},b:[[["attack"],10]],p:[{w:["attack"],d:3,on:3,t:"heal for +1 HP"}]},
{n:"Self-Recalibrating Mogu Plates",k:"Armor",s:{armor:4},p:[{w:["defense"],d:3,on:3,t:"on a failed roll, take 1 less damage"}]},
{n:"Faerie Dust Capsule",k:"Armor",t:"6x per day, BA flare",b:[[["control"],15]]},
{n:"Power Armor Boots",k:"Armor",s:{armor:6,"battlefield resilience":1},b:[[["tank"],10]]},
{n:"Kyparite Damage Recalculator",k:"Accessories",t:"\u22121 dmg taken from piercing (min 1)",b:[[["debuffdef","physical"],10]]},
{n:"Replica Stormrage Signet Ring",k:"Accessories",s:{"armor penetration":1},b:[[["attack","weapon"],20]]}
]};
const CHARS=[ETHAN,GALGAR];
let C=ETHAN;
const act=()=>C.src.filter(s=>s.on!==false);

function render(){
 $("nm").textContent=C.name;$("sb").textContent=C.sub||"";
 const st={...C.base};act().forEach(s=>{for(const k in s.s||{})st[k]=(st[k]||0)+s.s[k]});
 const core=["health","armor","mana","rage","speed","stamina"];
 let h=`<span>HP ${st.health||0} + ${st.armor||0} armor</span>`+["mana","rage","speed","stamina"].filter(k=>st[k]!==undefined).map(k=>`<span>${k[0].toUpperCase()+k.slice(1)} ${st[k]}</span>`).join("");
 $("st").innerHTML=h;
 let L=[];
 Object.keys(st).filter(k=>!core.includes(k)&&st[k]).forEach(k=>L.push(`<div>${sg(st[k])} ${esc(k)}</div>`));
 const m={};act().forEach(s=>(s.b||[]).forEach(([w,v])=>{const k=[...w].sort().join("+");(m[k]=m[k]||{w,v:0}).v+=v}));
 const E=Object.values(m),sub=(a,b)=>a.every(t=>b.includes(t));
 const B=E.map(e=>({l:label(e.w),v:E.filter(f=>sub(f.w,e.w)).reduce((a,f)=>a+f.v,0),o:E.some(f=>f.w.length>e.w.length&&sub(e.w,f.w))})).sort((a,b)=>a.l.localeCompare(b.l));
 L.push(`<div class="h">Roll bonuses</div>`);
 B.forEach(b=>L.push(`<div>${sg(b.v)} ${b.o?"other ":""}${esc(b.l)}</div>`));
 const pr=[];act().forEach(s=>(s.p||[]).forEach(p=>pr.push(`<div class="p">On ${esc(label(p.w))}: 1d${p.d}, on ${p.on}+: ${esc(p.t)}</div>`)));
 if(pr.length)L.push(`<div class="h">Procs</div>`,...pr);
 const nt=act().filter(s=>s.t).map(s=>`<div>${esc(s.t)}</div>`);
 if(nt.length)L.push(`<div class="h">Effects</div>`,...nt);
 const pf=Object.entries(C.profs||{}).map(([k,v])=>`${nm(k)} (${sg(v)})`).join(", ");
 if(pf)L.push(`<div class="h">Crit proficiencies</div><div>${esc(pf)}</div>`);
 $("sh").innerHTML=L.join("");
 let g="",o="";C.src.forEach((s,i)=>{if(s.k!==g){g=s.k;o+=`<h3>${esc(g)}</h3>`}o+=`<label><input type="checkbox" data-i="${i}" ${s.on===false?"":"checked"}>${esc(s.n)}</label>`});
 $("sr").innerHTML=o;
 $("js").value=JSON.stringify(C,null,1);
 preview();
}

function calc(){
 const sc=$("sc").value,ty=$("ty").value;
 const set=new Set([...(sc?anc(sc):[]),...anc(ty)]);
 [...document.querySelectorAll("#md input:checked")].forEach(c=>set.add(c.value));
 if(set.has("taunt")||set.has("flare")){set.add("minor");set.add("control")}
 if(sc&&anc(sc).pop()==="physical")set.add("nonmagical");
 const lines=[];
 act().forEach(s=>(s.b||[]).forEach(([w,v])=>{if(w.every(t=>set.has(t)))lines.push([s.n,v])}));
 const procs=[];act().forEach(s=>(s.p||[]).forEach(p=>{if(p.w.every(t=>set.has(t)))procs.push({...p,from:s.n})}));
 const mine=sc&&P[sc]!=="armor"?(C.profs||{})[sc]||0:null;return{lines,procs,mine,tot:lines.reduce((a,l)=>a+l[1],0)};
}
const thr=c=>100-(c.mine-(+$("en").value||0));
function critLine(c){if(c.mine===null)return"";const t=thr(c);return `<div class="break mut"><span>${t>100?"Crit not possible":"Crit on "+Math.max(t,1)+"+"} (your ${sg(c.mine)} vs their ${sg(+$("en").value||0)})</span></div>`}
function preview(){
 const c=calc();
 $("pv").innerHTML=(c.lines.length?c.lines.map(l=>`<div class="break"><span>${esc(l[0])}</span><b>${sg(l[1])}</b></div>`).join(""):`<div class="mut">No bonuses apply.</div>`)+`<div class="break total"><span>Total bonus</span><b>${sg(c.tot)}</b></div>`+critLine(c);
 $("pc").innerHTML=c.procs.map((p,i)=>`<label class="row" style="margin:0 0 8px"><input type="checkbox" data-p="${i}" checked><span>Roll proc: 1d${p.d}, on ${p.on}+ ${esc(p.t)} <span class="mut">(${esc(p.from)})</span></span></label>`).join("");
 $("rs").innerHTML="";
}
function roll(){
 const c=calc(),d=1+Math.floor(Math.random()*100);
 let h=`<div class="big">${d+c.tot}</div><div class="mut">d100 rolled ${d} ${sg(c.tot)} bonus</div>`;
 if(c.mine!==null){const cr=d>=thr(c);h+=`<div class="${cr?"proc":"mut"}">${cr?"Critical hit!":"No crit."}</div>`}
 document.querySelectorAll("#pc input:checked").forEach(b=>{
  const p=c.procs[b.dataset.p],r=1+Math.floor(Math.random()*p.d),hit=r>=p.on;
  h+=`<div style="margin-top:8px"><span class="${hit?"proc":"mut"}">${hit?"Proc!":"No proc."}</span> 1d${p.d} rolled ${r}${hit?`: ${esc(p.t)}`:""}</div>`});
 $("rs").innerHTML=h;
}

function fillCs(){$("cs").innerHTML=CHARS.map((c,i)=>`<option value="${i}" ${c===C?"selected":""}>${esc(c.name)}</option>`).join("")}
function setup(){
 $("sc").innerHTML=`<option value="">None</option>`+Object.keys(G).map(g=>`<optgroup label="${nm(g)[0].toUpperCase()+nm(g).slice(1)}">${G[g].map(s=>`<option value="${s}">${esc(nm(s))}</option>`).join("")}</optgroup>`).join("");
 $("ty").innerHTML=Object.keys(T).map(g=>`<optgroup label="${g}">${T[g].map(([i,n])=>`<option value="${i}">${n}</option>`).join("")}</optgroup>`).join("");
 $("md").innerHTML=MODS.map(([v,n])=>`<label><input type="checkbox" value="${v}">${n}</label>`).join("");
 $("sc").onchange=$("ty").onchange=$("md").onchange=preview;
 $("go").onclick=roll;$("en").oninput=preview;fillCs();$("cs").onchange=()=>{C=CHARS[$("cs").value];render()};
 $("sr").onchange=e=>{C.src[e.target.dataset.i].on=e.target.checked;render()};
 $("ap").onclick=()=>{try{const n=JSON.parse($("js").value);CHARS[CHARS.indexOf(C)]=n;C=n;$("er").textContent="";fillCs();render()}catch(x){$("er").textContent="Could not read the JSON: "+x.message}};
 render();
}
setup();
</script></body></html>
